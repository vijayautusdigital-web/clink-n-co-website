backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/clink-n-co
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: "https://clinknco.netlify.app"
display_url: "https://clinknco.netlify.app"
logo_url: "/assets/images/brand-logo.webp"

collections:
  - name: "catalogue"
    label: "Product Catalogue"
    files:
      - name: "products"
        label: "Products"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.slug}}"
            fields:
              - {label: "Product name", name: "name", widget: "string"}
              - {label: "URL slug", name: "slug", widget: "string", hint: "Use lowercase words separated by hyphens"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Primary keyword", name: "primaryKeyword", widget: "string"}
              - {label: "Secondary keywords", name: "secondaryKeywords", widget: "list"}
              - {label: "SEO title (under 60 characters)", name: "seoTitle", widget: "string"}
              - {label: "Meta description (under 150 characters)", name: "metaDescription", widget: "text"}
              - {label: "Short description", name: "shortDescription", widget: "text"}
              - {label: "Full description", name: "description", widget: "text"}
              - {label: "Material", name: "material", widget: "string", required: false}
              - {label: "Design", name: "design", widget: "string", required: false}
              - {label: "Gift use", name: "giftUse", widget: "string", required: false}
              - {label: "Product photo", name: "image", widget: "image"}
              - {label: "Image alt text", name: "alt", widget: "string"}
              - {label: "Price (optional)", name: "price", widget: "string", required: false}
              - {label: "Featured on homepage", name: "featured", widget: "boolean", default: false}
              - {label: "Published", name: "published", widget: "boolean", default: true}
      - name: "blogs"
        label: "Blogs"
        file: "content/blogs.json"
        format: "json"
        fields:
          - label: "Blog posts"
            name: "blogs"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "URL slug", name: "slug", widget: "string"}
              - {label: "Publish date", name: "date", widget: "datetime"}
              - {label: "Primary keyword", name: "primaryKeyword", widget: "string"}
              - {label: "Secondary keywords", name: "secondaryKeywords", widget: "list"}
              - {label: "SEO title (under 60 characters)", name: "seoTitle", widget: "string"}
              - {label: "Meta description (under 150 characters)", name: "metaDescription", widget: "text"}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Featured image", name: "featuredImage", widget: "image", required: false}
              - {label: "Image alt text", name: "imageAlt", widget: "string", required: false}
              - {label: "Article content", name: "body", widget: "markdown"}
              - {label: "Published", name: "published", widget: "boolean", default: true}
      - name: "videos"
        label: "Product Videos & Reels"
        file: "content/videos.json"
        format: "json"
        fields:
          - label: "Videos"
            name: "videos"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Video title", name: "title", widget: "string"}
              - {label: "Video file (MP4)", name: "videoFile", widget: "file", media_folder: "assets/videos/uploads", public_folder: "/assets/videos/uploads"}
              - {label: "Poster image", name: "poster", widget: "image"}
              - {label: "Video alt/caption", name: "alt", widget: "string"}
              - {label: "Featured video", name: "featured", widget: "boolean", default: false}
              - {label: "Published", name: "published", widget: "boolean", default: true}
      - name: "settings"
        label: "Website Settings"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "Brand name", name: "brandName", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "WhatsApp number", name: "whatsappNumber", widget: "string"}
          - {label: "Instagram profile URL", name: "instagramUrl", widget: "string"}
          - {label: "Delivery text", name: "deliveryText", widget: "string"}
          - {label: "Site URL", name: "siteUrl", widget: "string"}
          - {label: "Google Tag Manager ID", name: "gtmId", widget: "string", required: false}
          - {label: "Google Analytics 4 ID", name: "ga4Id", widget: "string", required: false}
          - {label: "Homepage primary keyword", name: "homepagePrimaryKeyword", widget: "string"}
          - {label: "Homepage secondary keywords", name: "homepageSecondaryKeywords", widget: "list"}
          - {label: "Contact primary keyword", name: "contactPrimaryKeyword", widget: "string"}
          - {label: "Contact secondary keywords", name: "contactSecondaryKeywords", widget: "list"}
